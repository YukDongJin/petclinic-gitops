apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-sync-exporter
  namespace: default
  labels:
    app: db-sync-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-sync-exporter
  template:
    metadata:
      labels:
        app: db-sync-exporter
    spec:
      containers:
        - name: exporter
          image: python:3.11-slim
          ports:
            - containerPort: 9101
              name: metrics
          env:
            - name: PG_HOST
              value: "petclinic-postgres-db.cjm8cae2ety1.ap-northeast-2.rds.amazonaws.com"
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: petclinic-db-secret
                  key: username
            - name: PG_PASS
              valueFrom:
                secretKeyRef:
                  name: petclinic-db-secret
                  key: password
            - name: ORA_DSN
              value: "182.226.30.54:1521/PETCLINICDB1"
            - name: ORA_USER
              value: "dongjin"
            - name: ORA_PASS
              value: "Samta306305!"
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir oracledb psycopg2-binary prometheus_client
              python -u -c '
              import os, time, oracledb, psycopg2
              from prometheus_client import start_http_server, Gauge

              tables = ["owners", "pets", "types", "visits"]
              ora_cnt = Gauge("petclinic_oracle_table_count", "Row count in Oracle", ["table"])
              pg_cnt = Gauge("petclinic_rds_table_count", "Row count in RDS", ["table"])
              ora_max = Gauge("petclinic_oracle_max_id", "Max ID in Oracle", ["table"])
              pg_max = Gauge("petclinic_rds_max_id", "Max ID in RDS", ["table"])
              diff_cnt = Gauge("petclinic_sync_diff_count", "Row count diff", ["table"])

              start_http_server(9101)
              while True:
                  o_data, p_data = {}, {}
                  try:
                      with oracledb.connect(user=os.environ["ORA_USER"], password=os.environ["ORA_PASS"], dsn=os.environ["ORA_DSN"]) as oconn:
                          with oconn.cursor() as cur:
                              for t in tables:
                                  cur.execute(f"SELECT COUNT(*), COALESCE(MAX(id), 0) FROM {t}")
                                  o_data[t] = cur.fetchone()
                  except Exception:
                      pass

                  try:
                      with psycopg2.connect(host=os.environ["PG_HOST"], dbname="petclinic", user=os.environ["PG_USER"], password=os.environ["PG_PASS"], sslmode="require") as pconn:
                          with pconn.cursor() as cur:
                              for t in tables:
                                  cur.execute(f"SELECT COUNT(*), COALESCE(MAX(id), 0) FROM {t}")
                                  p_data[t] = cur.fetchone()
                  except Exception:
                      pass

                  for t in tables:
                      if t in o_data:
                          ora_cnt.labels(table=t).set(o_data[t][0])
                          ora_max.labels(table=t).set(o_data[t][1])
                      if t in p_data:
                          pg_cnt.labels(table=t).set(p_data[t][0])
                          pg_max.labels(table=t).set(p_data[t][1])
                      if t in o_data and t in p_data:
                          diff_cnt.labels(table=t).set(abs(o_data[t][0] - p_data[t][0]))
                  time.sleep(5)
              '
---
apiVersion: v1
kind: Service
metadata:
  name: db-sync-exporter
  namespace: default
  labels:
    app: db-sync-exporter
spec:
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101
  selector:
    app: db-sync-exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: db-sync-exporter-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: db-sync-exporter
  endpoints:
    - port: metrics
      interval: 5s